[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wl-expcontroller"
version = "0.0.1"
description = "Behavioural task controller for closed-loop NHP neurophysiology"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# numpy: least squares and the SVD behind the conditioning gate. The gate is
# wl-preproc's, computed with numpy on their side, and matching their numerics
# matters more than saving the dependency (ADR-0004 inventory).
dependencies = ["pydantic>=2", "numpy>=1.24"]

[project.scripts]
wlx = "wl_expcontroller.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# What the CONTRACT tests need in order to import wl-preproc's own modules -- not
# what this package needs. Their `eye/expcontroller.py` reads YAML, so proving our
# writer against their reader means having their reader importable. Deliberately the
# minimum: `pip install -e ./wl-preproc` would pull DataJoint, Kilosort and
# SpikeInterface, which is exactly the pipeline stack `tests/conftest.py` says has no
# business near a task PC. numpy and pydantic are already here.
contract = ["pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["wl_expcontroller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tasks/` is reference material, not part of the installed package
# (`packages.find` includes only `wl_expcontroller*`), and `tests/test_gaze.py`
# imports a task from it. Without this, `python -m pytest` passes -- it puts the
# working directory on `sys.path` -- and bare `pytest` fails, which is how a green
# local run and a red CI run came from identical code.
pythonpath = ["."]
