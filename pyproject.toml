[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wl-expcontroller"
version = "0.0.1"
description = "Behavioural task controller for closed-loop NHP neurophysiology"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.scripts]
wlx = "wl_expcontroller.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["wl_expcontroller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
