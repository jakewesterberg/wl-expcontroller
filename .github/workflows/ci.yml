name: ci

on:
  push:
  pull_request:
  schedule:
    # The full sweep, nightly. Not decoration: the per-push gate selects on changed
    # files, which cannot see a test deleted from `test_a.py` that was the only thing
    # covering a function in `b.py`. Nothing in a diff makes that visible, and this
    # is what catches it.
    - cron: "17 3 * * *"

# Both jobs need a `wl-preproc` checkout, and getting one has failed three different
# ways. Recorded here because each looked fixed and was not:
#
#   1. No checkout at all (until 2026-09-01). The codec round-trip skipped silently
#      into a green build -- `actions/checkout` fetches this repository alone.
#   2. `path: ../wl-preproc` (2026-09-01). Never ran, because nothing was pushed for
#      four days; it would have thrown anyway, since actions/checkout resolves `path`
#      against $GITHUB_WORKSPACE and refuses anything escaping it.
#   3. No token (2026-09-05). `GITHUB_TOKEN` is scoped to THIS repository, so
#      checking out a second private one returned `Not Found`.
#
# Resolved by `wl-preproc` going public the same day (ADR-0004): the default
# `GITHUB_TOKEN` can read a public repository, so no secret is involved. **If
# wl-preproc is ever made private again this breaks**, and the fix is a fine-grained
# PAT with Contents:read added as `WL_PREPROC_TOKEN` and passed as `token:` below.
#
# The round-trip and the calibration contract are the only checks that we emit
# wl-preproc's protocol and fit their model rather than our idea of either. They are
# not allowed to skip, so `WLX_REQUIRE_PREPROC=1` turns a skip into a failure: a
# contract test that is allowed to not run is not a contract test.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of the supported range. The ceiling is PsychoPy's: 2026.2.3
        # declares <3.13, so 3.13 cannot run the display layer. 3.13 stays in the
        # matrix deliberately, testing the core -- schema, checks, encoder, runner,
        # record -- which has no display dependency and must not acquire one. If a
        # 3.13 job ever fails on an import, something has leaked through
        # DisplayAdapter and that is worth failing over.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check out wl-preproc inside the workspace
        uses: actions/checkout@v4
        with:
          repository: jakewesterberg/wl-preproc
          path: wl-preproc
      - run: pip install -e ".[dev,contract]"
      - run: pytest -q
        env:
          WLX_REQUIRE_PREPROC: "1"

  mutation:
    # A green suite proves the tests pass. This proves they can fail: every function
    # is neutered in turn and the job fails if any survives. A test that cannot fail
    # reports safety it does not provide, which for a checker whose whole job is
    # refusing bad tasks would be worse than having no checker (pitfalls P15).
    #
    # **Selective since 2026-09-05**, because the full sweep re-runs the whole suite
    # once per function and had reached twenty-five minutes. `tools/mutation_gate.py`
    # picks the modules a change can have affected and escalates to everything on
    # anything structural. It also refuses to run at all if a module in
    # `wl_expcontroller/` appears in neither its gated nor its exempt list -- which
    # is the real fix here, since the hand-maintained list this replaces had silently
    # omitted `bounds` (the welfare-critical module), `scheduler` and `findings`
    # while CHECKPOINT described "a mutation gate over every module".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the previous commit or the PR base, so the
          # shallow default clone is not enough.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out wl-preproc inside the workspace
        uses: actions/checkout@v4
        with:
          repository: jakewesterberg/wl-preproc
          path: wl-preproc
      - run: pip install -e ".[dev,contract]"
      - name: Mutation gate
        # WLX_REQUIRE_PREPROC applies to every sweep now, not just the two that named
        # it: each sweep runs the whole suite as its baseline, and a baseline with the
        # contract tests skipped is a baseline that proves less than it appears to.
        env:
          WLX_REQUIRE_PREPROC: "1"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tools/mutation_gate.py --all
          elif [ -n "${{ github.base_ref }}" ]; then
            python tools/mutation_gate.py --base "origin/${{ github.base_ref }}"
          else
            python tools/mutation_gate.py --base "${{ github.event.before }}"
          fi
