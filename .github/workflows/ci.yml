name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of the supported range. The ceiling is PsychoPy's: 2026.2.3
        # declares <3.13, so 3.13 cannot run the display layer. 3.13 stays in the
        # matrix deliberately, testing the core -- schema, checks, encoder, runner,
        # record -- which has no display dependency and must not acquire one. If a
        # 3.13 job ever fails on an import, something has leaked through
        # DisplayAdapter and that is worth failing over.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check out wl-preproc beside this repo
        # The event-codec round-trip is the only check that we emit *their*
        # protocol rather than our idea of it, and `actions/checkout` fetches this
        # repository alone -- so those tests were skipping silently into a green
        # build. WLX_REQUIRE_PREPROC turns the skip into a failure, so a checkout
        # that stops working is loud instead of invisible.
        #
        # `path` is INSIDE the workspace, not `../wl-preproc`. actions/checkout
        # resolves `path` against $GITHUB_WORKSPACE and throws on anything that
        # escapes it, so the sibling layout that works on a laptop fails the step
        # here. tests/conftest.py searches both.
        uses: actions/checkout@v4
        with:
          repository: jakewesterberg/wl-preproc
          path: wl-preproc
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          WLX_REQUIRE_PREPROC: "1"

  mutation:
    # A green suite proves the tests pass. This proves they can fail: every
    # load-time check and every encoder function is neutered in turn, and the job
    # fails if any survives. A test that cannot fail reports safety it does not
    # provide, which for a checker whose whole job is refusing bad tasks would be
    # worse than having no checker (pitfalls P15).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The mutation job needs it too, and not having it is why this job was RED
      # from 2026-08-31 to 2026-09-05 with three survivors: `words_for`,
      # `words_for_code` and `_checksum` are caught by the round-trip alone, and the
      # round-trip was skipping. A mutation gate running without its contract tests
      # reports that tests can fail while the ones that would have failed did not run.
      - name: Check out wl-preproc inside the workspace
        uses: actions/checkout@v4
        with:
          repository: jakewesterberg/wl-preproc
          path: wl-preproc
      - run: pip install -e ".[dev]"
      # Every module, methods included. The harness exits non-zero on a survivor,
      # so a test that cannot fail fails the build.
      - run: python tools/mutate.py --all wl_expcontroller/check.py
      - run: python tools/mutate.py --all wl_expcontroller/encode.py
        env:
          WLX_REQUIRE_PREPROC: "1"
      - run: python tools/mutate.py --all wl_expcontroller/calibration.py
        env:
          WLX_REQUIRE_PREPROC: "1"
      - run: python tools/mutate.py --all wl_expcontroller/gaze.py
      - run: |
          for module in run simulate review record geometry task codes components cli taskd photometry eye dio; do
            python tools/mutate.py --all --returns None "wl_expcontroller/$module.py"
          done
