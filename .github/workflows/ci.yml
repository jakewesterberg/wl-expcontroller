name: ci

on: [push, pull_request]

# Both jobs need a `wl-preproc` checkout, and getting one has failed three different
# ways. Recorded here because each looked fixed and was not:
#
#   1. No checkout at all (until 2026-09-01). The codec round-trip skipped silently
#      into a green build -- `actions/checkout` fetches this repository alone.
#   2. `path: ../wl-preproc` (2026-09-01). Never ran, because nothing was pushed for
#      four days; it would have thrown anyway, since actions/checkout resolves `path`
#      against $GITHUB_WORKSPACE and refuses anything escaping it.
#   3. No token (2026-09-05). `GITHUB_TOKEN` is scoped to THIS repository, so
#      checking out a second private one returned `Not Found`.
#
# Resolved by `wl-preproc` going public the same day (ADR-0004): the default
# `GITHUB_TOKEN` can read a public repository, so no secret is involved. **If
# wl-preproc is ever made private again this breaks**, and the fix is a fine-grained
# PAT with Contents:read added as `WL_PREPROC_TOKEN` and passed as `token:` below.
#
# The round-trip and the calibration contract are the only checks that we emit
# wl-preproc's protocol and fit their model rather than our idea of either. They are
# not allowed to skip, so `WLX_REQUIRE_PREPROC=1` turns a skip into a failure: a
# contract test that is allowed to not run is not a contract test.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of the supported range. The ceiling is PsychoPy's: 2026.2.3
        # declares <3.13, so 3.13 cannot run the display layer. 3.13 stays in the
        # matrix deliberately, testing the core -- schema, checks, encoder, runner,
        # record -- which has no display dependency and must not acquire one. If a
        # 3.13 job ever fails on an import, something has leaked through
        # DisplayAdapter and that is worth failing over.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check out wl-preproc inside the workspace
        uses: actions/checkout@v4
        with:
          repository: jakewesterberg/wl-preproc
          path: wl-preproc
      - run: pip install -e ".[dev,contract]"
      - run: pytest -q
        env:
          WLX_REQUIRE_PREPROC: "1"

  mutation:
    # A green suite proves the tests pass. This proves they can fail: every
    # load-time check and every encoder function is neutered in turn, and the job
    # fails if any survives. A test that cannot fail reports safety it does not
    # provide, which for a checker whose whole job is refusing bad tasks would be
    # worse than having no checker (pitfalls P15).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out wl-preproc inside the workspace
        uses: actions/checkout@v4
        with:
          repository: jakewesterberg/wl-preproc
          path: wl-preproc
      - run: pip install -e ".[dev,contract]"
      # Every module, methods included. The harness exits non-zero on a survivor,
      # so a test that cannot fail fails the build.
      - run: python tools/mutate.py --all wl_expcontroller/check.py
      - run: python tools/mutate.py --all wl_expcontroller/encode.py
        env:
          WLX_REQUIRE_PREPROC: "1"
      - run: python tools/mutate.py --all wl_expcontroller/calibration.py
        env:
          WLX_REQUIRE_PREPROC: "1"
      - run: python tools/mutate.py --all wl_expcontroller/gaze.py
      - run: |
          for module in run simulate review record geometry task codes components cli taskd photometry eye dio; do
            python tools/mutate.py --all --returns None "wl_expcontroller/$module.py"
          done
